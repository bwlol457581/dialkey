help_dialog_title                = "DialKey"
help_about_no_docs               = "DialKey v{version}\n\nBàn phím macro phần mềm.\n\n1. Mở bằng nút chuột tiến (X2).\n2. Số kích hoạt ngay thì chạy liền. Số khác: nhấn + (dòng đầu giữ +: rồi +1, +10), gõ số, rồi Enter. Sau đó phím . chỉ mở thư mục làm việc (không chạy Path); Backspace xóa chữ số cuối (hoặc về màn hình đầu).\n3. Phím Tab hoặc bấm trái icon khay để Tìm kiếm. Phím hủy để đóng. Phím Cài đặt (/ mặc định) mở Cài đặt.\n\nMột số bàn phím không dây ngủ khi nghỉ. Ở Cài đặt → Phím bạn có thể nhớ phím ON của bàn; DialKey bỏ qua nó khi cửa sổ gõ đang mở, nên đánh thức không hủy hoặc chạy. Nhìn cửa sổ để chắc phím đã vào.\n\nThêm công cụ ở Cài đặt → Khe. Đổi sổ bằng nút chế độ (X1) rồi 0–9, hoặc khay → Chế độ.\n\nLưu ý: Cài đặt → Chung → Tải sao chép vào thư mục cài đặt và ghi đè tệp đó. DialKey không tiếp tục dùng bản sao lưu.\n\nMẹo: Path có thể là chain:11,20 để chạy nhiều khe cùng lúc.\n\nHướng dẫn đầy đủ: trang tài liệu (chưa đặt docsUrl)."
help_about_with_docs             = "DialKey v{version}\n\nBàn phím macro phần mềm.\n\n1. Mở bằng nút chuột tiến (X2).\n2. Số kích hoạt ngay thì chạy liền. Số khác: nhấn + (dòng đầu giữ +: rồi +1, +10), gõ số, rồi Enter. Sau đó phím . chỉ mở thư mục làm việc (không chạy Path); Backspace xóa chữ số cuối (hoặc về màn hình đầu).\n3. Phím Tab hoặc bấm trái icon khay để Tìm kiếm. Phím hủy để đóng. Phím Cài đặt (/ mặc định) mở Cài đặt.\n\nMột số bàn phím không dây ngủ khi nghỉ. Ở Cài đặt → Phím bạn có thể nhớ phím ON của bàn; DialKey bỏ qua nó khi cửa sổ gõ đang mở, nên đánh thức không hủy hoặc chạy. Nhìn cửa sổ để chắc phím đã vào.\n\nThêm công cụ ở Cài đặt → Khe. Đổi sổ bằng nút chế độ (X1) rồi 0–9, hoặc khay → Chế độ.\n\nLưu ý: Cài đặt → Chung → Tải sao chép vào thư mục cài đặt và ghi đè tệp đó. DialKey không tiếp tục dùng bản sao lưu.\n\nMẹo: Path có thể là chain:11,20 để chạy nhiều khe cùng lúc.\n\nCài đặt, ví dụ khe, FAQ:\n{url}\n\nMở trang tài liệu ngay?"
