help_dialog_title                = "DialKey"
help_about_no_docs               = "DialKey v{version}\n\nソフトウェア版マクロパッド。\n\n1. マウスの進むボタン（X2）で開く\n2. すぐ起動の数字はそのまま起動。それ以外は +（先頭行に + が残り、+1 / +10 と続く）のあと桁を入れて Enter。そのあと . は作業フォルダだけ開く（起動しない）。Backspace で直前の桁を消す（空なら最初の画面へ）\n3. Tab またはトレイ左クリックで検索。キャンセルで閉じる。設定キー（既定 /）で設定を開く\n\n無線パッドがスリープすることがあります。設定 → キー でパッドの ON を覚えると、打鍵窓の表示中はそれを無視するので、起き上がりでキャンセルや起動になりません。打鍵窓を見て、打ったキーが載ったか確認してください。\n\nツールの登録は 設定 → スロット。帳の切替はモードボタン（X1）→ 0–9、またはトレイ → モード。\n\n注意: 設定 → 一般 → Load は設定フォルダへコピーして上書きします。バックアップ先を参照し続けることはありません。\n\n補足: Path に chain:11,20 と書くと複数スロットをまとめて起動\n\n詳しい使い方はドキュメントサイト（docsUrl 未設定）。"
help_about_with_docs             = "DialKey v{version}\n\nソフトウェア版マクロパッド。\n\n1. マウスの進むボタン（X2）で開く\n2. すぐ起動の数字はそのまま起動。それ以外は +（先頭行に + が残り、+1 / +10 と続く）のあと桁を入れて Enter。そのあと . は作業フォルダだけ開く（起動しない）。Backspace で直前の桁を消す（空なら最初の画面へ）\n3. Tab またはトレイ左クリックで検索。キャンセルで閉じる。設定キー（既定 /）で設定を開く\n\n無線パッドがスリープすることがあります。設定 → キー でパッドの ON を覚えると、打鍵窓の表示中はそれを無視するので、起き上がりでキャンセルや起動になりません。打鍵窓を見て、打ったキーが載ったか確認してください。\n\nツールの登録は 設定 → スロット。帳の切替はモードボタン（X1）→ 0–9、またはトレイ → モード。\n\n注意: 設定 → 一般 → Load は設定フォルダへコピーして上書きします。バックアップ先を参照し続けることはありません。\n\n補足: Path に chain:11,20 と書くと複数スロットをまとめて起動\n\nインストール・スロット例・FAQ:\n{url}\n\nサイトを開きますか？"
